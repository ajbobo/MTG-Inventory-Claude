<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Inventory</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main>
    <!-- Set selector -->
    <div class="controls">
      <div class="set-select-wrapper">
        <span class="set-icon-left" id="setIconLeft"></span>
        <select id="setSelect">
          <option value="">-- Choose a set --</option>
        </select>
        <span class="set-icon-right" id="setIconRight"></span>
      </div>
    </div>

    <!-- Card search -->
    <div class="search-controls" id="searchControls" style="display: none;">
      <div class="search-wrapper">
        <input type="text" id="cardSearch" placeholder="Search cards by name..." autocomplete="off">
        <button type="button" id="clearSearch" title="Clear search">&times;</button>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>

    <!-- Filter controls -->
    <div class="filter-controls" id="filterControls" style="display: none;">
      <div class="filter-dropdowns">
        <select id="filterRarity" class="filter-select">
          <option value="all">All Rarities</option>
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
          <option value="mythic">Mythic</option>
        </select>
        <select id="filterCount" class="filter-select">
          <option value="all">All Counts</option>
          <option value="eq0">=0</option>
          <option value="ge1">>=1</option>
          <option value="ge4">>=4</option>
          <option value="lt4">&lt;4</option>
        </select>
        <select id="filterPrice" class="filter-select">
          <option value="all">All Prices</option>
          <option value="ge1">≥ $1.00</option>
          <option value="ge10">≥ $10.00</option>
        </select>
      </div>
    </div>

    <!-- Card list -->
    <div class="cards-section">
      <table id="cardsTable">
        <thead>
          <tr>
            <th>Number</th>
            <th>Rarity</th>
            <th>Card</th>
            <th>Casting Cost</th>
            <th>Price</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
