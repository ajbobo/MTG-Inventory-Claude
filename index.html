<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Inventory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>MTG Inventory</h1>

    <!-- Set selector -->
    <div class="controls">
      <div class="set-select-wrapper">
        <span class="set-icon-left" id="setIconLeft"></span>
        <select id="setSelect">
          <option value="">-- Choose a set --</option>
        </select>
        <span class="set-icon-right" id="setIconRight"></span>
      </div>
    </div>

    <!-- Card list -->
    <div class="cards-section">
      <table id="cardsTable">
        <thead>
          <tr>
            <th>Number</th>
            <th>Card</th>
            <th>Rarity</th>
            <th>Casting Cost</th>
            <th>Price</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
